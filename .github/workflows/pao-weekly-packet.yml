# PAO — weekly distribution packet. Drafting only; never posts, sends, or
# publishes. Holds no platform credential of any kind.
#
# Doctrine: deploy-discipline v1.4 (CI WORKFLOWS - FETCHED CONTENT IS DATA).
# Findings sink is GitHub Issues per ruling R1. permissions: contents: read
# means this job CANNOT write a ref. That is why the packet is an issue and not
# a file in ops-reports/: committing would require contents: write, which
# reverses the one guarantee the scheduled-ops design rests on.
#
# NOT THE DEAD-MAN'S SWITCH. J3 is, and J3 is deliberately model-free so it
# keeps firing when the Anthropic balance is exhausted. This job uses a model,
# so it stops in exactly that situation. Do not put PAO in the alarm path and
# do not add a model to J3.
name: PAO weekly packet

on:
  # SCHEDULE WENT LIVE 14 AUG 2026, after a manual dispatch produced a packet
  # Dean read. It was held commented out until then so that "dispatch tested
  # before first schedule" was structural rather than promised.
  #
  # The first packet came back QUIET - every input read, nothing shipped, no
  # drafts written - and that is the better proof than a busy week would have
  # been. It shows the job declines to manufacture content when there is
  # nothing to say, which is the failure mode a weekly comms cadence actually
  # has. A packet full of filler on a quiet week is how a channel dies.
  #
  # 12:00 UTC Monday is one hour ahead of J3's 13:00 SITREP, so the packet
  # exists when the SITREP assembles. Actions cron is UTC and ignores DST.
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — render the full packet, file nothing'
        type: boolean
        default: false

permissions:
  contents: read              # CANNOT write a ref. The safety property.
  issues: write               # the packet, and the pinned baseline
  actions: read

concurrency:
  group: pao-weekly-packet
  cancel-in-progress: false

jobs:
  packet:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MODEL: claude-haiku-4-5-20251001
      BASELINE_TITLE: 'PAO BASELINE — DO NOT CLOSE'
      # PINNED baseline issue number, an in-file constant so it is reviewable in
      # a diff rather than living invisibly in the dashboard. EMPTY until Dean
      # bootstraps the issue: this job will not create one, for the same reason
      # J1 will not - a lookup that fails is indistinguishable from a first run,
      # and one transient error would invent a second baseline.
      BASELINE_ISSUE: '22'
      # DRY RUN. The PAO's only outward act is filing an issue, so suppressing
      # gh issue create is the whole of it — every other step, including the
      # model draft and the renderer, runs exactly as on a real Monday. What
      # would have been filed is written to out/ and lands in the artifact.
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Mark start for metering
        run: echo "METER_STARTED=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"


      - name: Assert model tier
        run: |
          test "$MODEL" = "claude-haiku-4-5-20251001" || { echo "::error::model tier violation"; exit 1; }

      # THE EXIT 127. Run 31799240790 failed here in 12 seconds with "command
      # not found": the workflow called `claude -p` in Draft the packet without
      # ever installing it. J1 has carried this step since authorship; PAO was
      # written from J1's shape and this line was dropped. Same pinned version
      # as J1 - two jobs on different CLI versions is a difference nobody would
      # think to check when their outputs diverge.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.220

      - name: Assert baseline is bootstrapped
        run: |
          if [ -z "$BASELINE_ISSUE" ]; then
            echo "::error::BASELINE_ISSUE is empty. Bootstrap the pinned '$BASELINE_TITLE' issue by hand, then set its number in this file. This job does not create baselines."
            exit 1
          fi

      # Every path the prompt names is asserted HERE, before the model runs.
      # J1 shipped a prompt naming diff-manifest.json while the workflow wrote
      # out/diff-manifest.json; it survived to production because the step that
      # would have caught it only runs on change days. This check runs always.
      - name: Assert prompt input paths exist
        run: |
          mkdir -p out
          rc=0
          for p in index.html intel/verification-log.md .claude/pao-context.md .claude/skills/brand-voice/SKILL.md .claude/prompts/pao-weekly-packet.txt; do
            if [ -f "$p" ]; then echo "ok   $p"; else echo "::error::missing input: $p"; rc=1; fi
          done
          exit $rc

      - name: Read baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source .github/scripts/gh-retry.sh   # bounded, idempotent gh retries
          if ! gh issue view "$BASELINE_ISSUE" --json number,title,state > out/baseline-meta.json; then
            echo "::error::baseline issue #$BASELINE_ISSUE could not be read. NOT assuming first run."
            exit 1
          fi
          TITLE=$(jq -r .title out/baseline-meta.json)
          STATE=$(jq -r .state out/baseline-meta.json)
          if [ "$TITLE" != "$BASELINE_TITLE" ]; then
            echo "::error::issue #$BASELINE_ISSUE is titled '$TITLE', expected '$BASELINE_TITLE'. Refusing to use it."
            exit 1
          fi
          if [ "$STATE" != "OPEN" ]; then
            echo "::error::baseline issue #$BASELINE_ISSUE is $STATE. Refusing to proceed."
            exit 1
          fi
          gh issue view "$BASELINE_ISSUE" --json body --jq .body \
            | sed -n '/^```json$/,/^```$/p' | sed '1d;$d' > out/pao-baseline.json
          if ! python3 -c 'import json;json.load(open("out/pao-baseline.json"))' 2>/dev/null; then
            echo "::error::baseline body is not valid JSON."
            exit 1
          fi
          cat out/pao-baseline.json

      - name: Draft the packet
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat .claude/prompts/pao-weekly-packet.txt)" \
            --model "$MODEL" \
            --allowed-tools "Read" \
            --max-budget-usd 0.75 \
            --output-format json > out/packet-result.json
          echo "drafting complete"

      - name: Ensure labels exist
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source .github/scripts/gh-retry.sh   # bounded, idempotent gh retries
          existing=$(gh label list --limit 200 --json name --jq '.[].name' || true)
          for L in FLASH ROUTINE; do
            if printf '%s\n' "$existing" | grep -qx "$L"; then
              echo "label $L present"
            else
              gh label create "$L" --description "Transition OPS scheduled ops" || \
                echo "::warning::could not create label $L"
            fi
          done

      - name: File the packet
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          source .github/scripts/gh-retry.sh   # bounded, idempotent gh retries
          # Default FAILED. If the renderer dies before writing the status file,
          # the safe reading is "we do not know this packet is trustworthy".
          echo FAILED > out/pao-status.txt
          DATE=$(date -u +%F)
          if ! python3 .github/scripts/pao-render-packet.py \
                 out/packet-result.json out/packet.md "$DATE" "$RUN_ID" out/pao-status.txt; then
            echo "::warning::packet renderer failed; falling back to raw dump"
            {
              printf 'PAO PACKET RENDERER FAILED — the drafting output is below unformatted.\n'
              printf 'Nothing here has been posted. Run: %s\n\n' "$RUN_ID"
              printf '````json\n'
              cat out/packet-result.json
              printf '\n````\n'
            } > out/packet.md
          fi
          STATUS=$(tr -d '[:space:]' < out/pao-status.txt 2>/dev/null || echo FAILED)
          case "$STATUS" in
            OK)     TITLE="PAO packet $DATE"; LABEL=ROUTINE ;;
            QUIET)  TITLE="PAO packet $DATE — quiet week, no drafts"; LABEL=ROUTINE ;;
            *)      TITLE="PAO PACKET FAILED — inputs unread $DATE"; LABEL=FLASH ;;
          esac
          echo "status=$STATUS title=$TITLE label=$LABEL"
          if [ "$DRY_RUN" = "1" ]; then
            printf 'DRY RUN — would file:\n  label: %s\n  title: %s\n' "$LABEL" "$TITLE" \
              | tee out/dry-run-packet.txt
            echo "DRY RUN — nothing filed. Body is out/packet.md in the artifact."
          else
            if ! gh issue create --label "$LABEL" --title "$TITLE" --body-file out/packet.md \
                 && ! gh issue create --title "$TITLE" --body-file out/packet.md; then
              # Both attempts failed, so nothing was filed. Without this the step
              # fell through to the status case and a total filing failure on an
              # OK packet still exited green -- the same lie in a different place.
              # Deliberately NO marker here. The marker means "a specific FLASH
              # was successfully filed"; nothing was. Leave the generic reporter
              # free to try -- it is the only signal left.
              echo "::error::could not file the packet issue; nothing was filed"
              exit 1
            fi
          fi

          # THE RUN STATUS MUST MATCH THE PACKET STATUS. Run 33425889905's
          # predecessor on 2026-08-17 exited green while filing "PAO PACKET
          # FAILED — inputs unread": the dashboard said success, the packet said
          # failure. Every readiness check that leans on run status was reading
          # a number that did not mean anything. A packet that did not render is
          # a failed run, and the run now says so.
          #
          # The marker stops the if: failure() reporter double-filing: this step
          # has already filed a specific FLASH, so the generic one would be
          # noise. A crash BEFORE this point leaves no marker and still gets the
          # generic reporter, which is the case it exists for.
          case "$STATUS" in
            OK|QUIET) ;;
            *) : > out/pao-already-reported
               echo "::error::packet status $STATUS — failing the run so it cannot read as success"
               exit 1 ;;
          esac

      # EVERY run emits one record, including failures and quiet runs.
      # if: always() is the whole point: the runs that used to be
      # invisible to J5 were exactly the ones that filed no issue.
      - name: Emit metering record
        if: always()
        run: |
          source .github/scripts/emit-metering.sh
          n=0
          [ -f out/packet-result.json ] && n=1
          emit_metering pao "$n" "${MODEL:-none}" "${{ job.status }}"

      - name: Upload evidence
        if: always()
        # v4.6.2 runs on node20, which Actions now warns is deprecated. The
        # other five workflows already pin v7.0.1; PAO was the sole outlier
        # because it was authored from an older reference. This is removing
        # drift from an established pin, not choosing a new version.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pao-evidence-${{ github.run_id }}
          path: out/
          retention-days: 30

      # A job that dies before filing reports NOTHING. Every other workflow in
      # this repo carries an if: failure() reporter; PAO shipped without one,
      # so run 31799240790 crashed and filed no issue at all - the only signal
      # was a red run nobody was watching for.
      #
      # This is a WORSE failure than the one J1 was just fixed for. J1 filed a
      # quiet day over a blind scan: wrong, but visible and auditable. Silence
      # is not auditable. A packet that never arrives looks exactly like a week
      # with nothing to say.
      #
      # Runner values reach the shell through env:, never through run:.
      - name: Report failure loudly
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          source .github/scripts/gh-retry.sh   # bounded, idempotent gh retries
          mkdir -p out
          if [ -f out/pao-already-reported ]; then
            echo "packet step already filed a specific FLASH; not duplicating it"
            exit 0
          fi
          printf '1 item may need your eyes: the PAO packet failed, so this week produced no distribution drafts.\n\n' > out/failure.md
          printf 'PAO failed. Run %s. Evidence is in the run artifacts.\n\n' "$RUN_ID" >> out/failure.md
          printf 'NOTHING WAS POSTED OR SENT. The PAO holds no platform credential, so a\n' >> out/failure.md
          printf 'failure here costs a packet, never a bad post.\n\n' >> out/failure.md
          if [ -f out/pao-status.txt ]; then
            printf 'Renderer status at failure: %s\n\n' "$(tr -d '[:space:]' < out/pao-status.txt)" >> out/failure.md
          fi
          if [ "$DRY_RUN" = "1" ]; then
            echo "DRY RUN — would file FLASH: PAO FAILED $(date -u +%F)"
            cat out/failure.md
            exit 0
          fi
          URL=$(gh issue create --label FLASH --title "PAO FAILED $(date -u +%F)" --body-file out/failure.md) \
          || URL=$(gh issue create --title "PAO FAILED $(date -u +%F)" --body-file out/failure.md)
          N="${URL##*/}"
          case "$N" in
            ''|*[!0-9]*)
              echo "::warning::could not read an issue number from '$URL'; ACTING ON THIS footer not appended" ;;
            *)
              { cat out/failure.md
                printf '\n---\n\n## ACTING ON THIS\n\n'
                printf 'An order for you to paste into an interactive session. The machine does not run it and ships nothing.\n\n'
                printf '```text\n'
                printf 'URGENT — machine failure session. Source: issue #%s, job: PAO. s3-devops: read the run evidence, diagnose the failure, and propose the fix on a branch; gate it and stage on my approval. I merge.\n' "$N"
                printf '```\n'
              } > out/failure-final.md
              gh issue edit "$N" --body-file out/failure-final.md \
                || echo "::warning::footer edit failed for #$N; the issue is filed without it" ;;
          esac
