# J3 — weekly SITREP. Assembly and send only.
#
# DELIBERATELY MODEL-FREE. There is no ANTHROPIC_API_KEY in this job and no
# claude invocation. Two reasons, both load-bearing:
#   1. Paying a model to concatenate a list is waste.
#   2. W-1: this job is the dead-man's switch. It must keep firing when the
#      Anthropic balance is exhausted and every model job has stopped. A model
#      in this path would kill the alarm at exactly the moment it is needed.
# Do not "improve" this job by adding a model to it.
#
# It files a SITREP issue rather than sending mail. No SMTP secret exists yet
# (V-5), and issue creation notifies through the watch path fixed on 3 AUG.
# When SMTP is wired, mail becomes an ADDITIONAL leg — never a replacement,
# because the issue is also the durable record.
name: J3 weekly SITREP

on:
  schedule:
    - cron: '0 13 * * 1'      # Mondays 13:00 UTC = 07:00 CST / 08:00 CDT. Actions cron is UTC; no DST.
  workflow_dispatch:

permissions:
  contents: read              # cannot write a ref
  issues: write               # the SITREP itself, and reading the week's findings

concurrency:
  group: j3-weekly-sitrep
  cancel-in-progress: false

jobs:
  sitrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BASELINE_TITLE: 'BASELINE — DO NOT CLOSE'
      ROUTINE_CANARY_TITLE: 'ROUTINE CHANNEL TEST'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Issue bodies can quote fetched pages, so they are untrusted text. They
      # are handled as JSON and written to files — never interpolated into a
      # command argument. deploy-discipline v1.4 applies to repo-resident
      # untrusted content exactly as it does to freshly fetched content.
      - name: Gather the week
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p out
          SINCE=$(date -u -d '7 days ago' +%F)
          echo "window opens $SINCE"
          echo "$SINCE" > out/since.txt
          gh issue list --state all --limit 200 \
            --search "created:>=$SINCE" \
            --json number,title,labels,createdAt,state \
            > out/week.json
          jq --arg t "$BASELINE_TITLE" --arg c "$ROUTINE_CANARY_TITLE" \
            '[.[] | select(.title != $t and .title != $c)]' out/week.json > out/findings.json
          jq 'length' out/findings.json

          # --- N7: ROUTINE ARRIVAL RATE, PER PRODUCER (design D.3) ---------
          # Counts ISSUES, which are already the ledger -- the same pattern N1
          # uses for FLASH. No new state store, and no actions: read needed:
          # this reads issues, which J3 already reads. Two 7-day buckets are
          # derived from ONE 14-day query so "2 consecutive weeks" is stateless
          # across runs and cannot drift if a run is missed.
          #
          # THRESHOLDS ARE JUDGMENT, NOT DERIVED. >5 ROUTINE issues per 7 days
          # in BOTH buckets trips. 5/wk sits just above J1's realistic rate and
          # just below daily; 2 consecutive weeks mirrors N3's confirm-before-
          # waking, because one busy week is weather. DUE FOR TUNING AFTER 60
          # DAYS of real arrival data.
          #
          # It NAMES the condition and never suppresses. Nothing is filtered,
          # dropped, or downgraded here -- a governor that silently drops
          # ROUTINE traffic reintroduces the failure this design exists to
          # prevent.
          N7_SINCE=$(date -u -d '14 days ago' +%F)
          N7_BOUNDARY=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh issue list --state all --limit 400 \
            --search "created:>=$N7_SINCE" \
            --json title,labels,createdAt \
            > out/n7-window.json
          jq -r --arg t "$BASELINE_TITLE" --arg c "$ROUTINE_CANARY_TITLE" --arg b "$N7_BOUNDARY" '
            [ .[]
              | select(.title != $t and .title != $c)
              | select(any(.labels[]?; .name == "ROUTINE"))
              | { producer: (if (.title | test("^J[0-9]")) then .title[0:2] else "other" end),
                  recent:   (.createdAt >= $b) } ]
            | group_by(.producer)
            | map({ producer: .[0].producer,
                    recent:   ([ .[] | select(.recent) ]       | length),
                    prior:    ([ .[] | select(.recent | not) ] | length) })
            | map(select(.recent > 5 and .prior > 5))
            | .[] | "\(.producer) \(.recent)"
          ' out/n7-window.json > out/n7-trips.txt || true
          echo "N7 producers tripping: $(wc -l < out/n7-trips.txt | tr -d " ")"

          # --- CHANNEL HEALTH: expected-vs-observed scheduled run counts ---
          # R1 holds: permissions: grants no actions: read (COMMANDER lane,
          # reserved separately). Every call below degrades to NA on
          # 403/404 and NEVER fails the step — the SITREP arriving is still
          # the channel test even when this block cannot instrument it.
          #
          # JUDGMENT (n=2, section 8.12): widen the run-count query window 6h
          # behind SINCE so J3's own observed lateness (up to 2h49m; 6h = 2x
          # worst observed, rounded up) never clips a punctual run off the
          # window's edge and misreports a real 7/7 as 6/7. Expected counts
          # are fixed by cadence (J1 daily = 7, J2 weekly = 1), never derived
          # from the widened window, so widening can only over-count, never
          # manufacture a phantom shortfall. Re-derive after 30 days.
          QSTART=$(date -u -d "$SINCE 00:00:00 -6 hours" +%Y-%m-%dT%H:%M:%SZ)

          fetch_runs() {
            # $1 = workflow file  $2 = output json path
            gh api "repos/${REPO}/actions/workflows/$1/runs?event=schedule&created=>=${QSTART}" \
              > "$2" 2>out/gh-api-err.txt
          }

          if fetch_runs "j1-federal-scan.yml" out/j1-runs.json; then
            J1_OBSERVED=$(jq '.workflow_runs | length' out/j1-runs.json)
          else
            J1_OBSERVED=NA
          fi
          echo "$J1_OBSERVED" > out/j1-observed.txt

          if fetch_runs "j2-weekly-analysis.yml" out/j2-runs.json; then
            J2_OBSERVED=$(jq '.workflow_runs | length' out/j2-runs.json)
          else
            J2_OBSERVED=NA
          fi
          echo "$J2_OBSERVED" > out/j2-observed.txt

          # Two consecutive calendar days with zero J1 scheduled runs,
          # independent of the total-count shortfall test.
          J1_GAP=NA
          if [ "$J1_OBSERVED" != "NA" ]; then
            RUN_DATES=$(jq -r '.workflow_runs[].created_at[0:10]' out/j1-runs.json | sort -u)
            J1_GAP=false
            PREV_ZERO=false
            for i in 0 1 2 3 4 5 6; do
              D=$(date -u -d "$SINCE +$i days" +%F)
              if printf '%s\n' "$RUN_DATES" | grep -qx "$D"; then
                THIS_ZERO=false
              else
                THIS_ZERO=true
              fi
              if [ "$THIS_ZERO" = true ] && [ "$PREV_ZERO" = true ]; then
                J1_GAP=true
              fi
              PREV_ZERO=$THIS_ZERO
            done
          fi
          echo "$J1_GAP" > out/j1-gap.txt

          # N6a: last ROUTINE canary on record, for the CHANNEL HEALTH line.
          # A read of prior state only — filing (if due this run) happens in
          # the later "File ROUTINE canary" step.
          gh issue list --state all --limit 50 \
            --search "\"$ROUTINE_CANARY_TITLE\" in:title" \
            --json title,createdAt \
            > out/canary-search.json || echo '[]' > out/canary-search.json
          jq --arg c "$ROUTINE_CANARY_TITLE" \
            '[.[] | select(.title == $c)] | sort_by(.createdAt) | last' \
            out/canary-search.json > out/last-canary.json
          cat out/last-canary.json

      - name: Compose SITREP
        run: |
          SINCE=$(cat out/since.txt)
          TOTAL=$(jq 'length' out/findings.json)
          FLASH=$(jq '[.[] | select(.labels[]?.name == "FLASH")] | length' out/findings.json)

          J1_OBSERVED=$(cat out/j1-observed.txt)
          J2_OBSERVED=$(cat out/j2-observed.txt)
          J1_GAP=$(cat out/j1-gap.txt)

          LAST_CANARY_DATE=$(jq -r 'if . == null then "" else (.createdAt // "" | .[0:10]) end' out/last-canary.json)
          if [ -z "$LAST_CANARY_DATE" ]; then
            LAST_CANARY_LINE="NONE FILED YET"
          else
            LAST_CANARY_LINE="$LAST_CANARY_DATE  FILED"
          fi

          # Escalation thresholds are JUDGMENT, from n=2 observations
          # (section 8.12): a shortfall of one is reported, not escalated. A
          # shortfall of two or more, or two consecutive zero-run J1 days,
          # promotes the BLUF. Re-derive after 30 days.
          BLUF_ITEMS=$FLASH
          CHANNEL_NOTE=""
          if [ "$J1_OBSERVED" != "NA" ]; then
            J1_SHORT=$((7 - J1_OBSERVED))
            if [ "$J1_SHORT" -ge 2 ]; then
              BLUF_ITEMS=$((BLUF_ITEMS + 1))
              CHANNEL_NOTE="${CHANNEL_NOTE}J1 scheduled runs short this window (7 expected / ${J1_OBSERVED} observed). "
            fi
          fi
          if [ "$J2_OBSERVED" != "NA" ]; then
            J2_SHORT=$((1 - J2_OBSERVED))
            if [ "$J2_SHORT" -ge 2 ]; then
              BLUF_ITEMS=$((BLUF_ITEMS + 1))
              CHANNEL_NOTE="${CHANNEL_NOTE}J2 scheduled runs short this window (1 expected / ${J2_OBSERVED} observed). "
            fi
          fi
          if [ "$J1_GAP" = "true" ]; then
            BLUF_ITEMS=$((BLUF_ITEMS + 1))
            CHANNEL_NOTE="${CHANNEL_NOTE}J1 had two consecutive zero-run days this window. "
          fi

          {
            # BLUF, first line, one sentence, so the mail preview answers
            # "read on?" without opening it. J3 assembles; it never originates
            # work. Anything that needs a session carries its own order in its
            # own issue, so this line points at them rather than tasking.
            if [ "$BLUF_ITEMS" -eq 0 ]; then
              printf 'NO ACTION NEEDED — informational: %s issue(s) filed this week, none FLASH.\n\n' "$TOTAL"
            else
              printf '%s item(s) may need your eyes: ' "$BLUF_ITEMS"
              if [ "$FLASH" -gt 0 ]; then
                printf '%s FLASH issue(s) filed this week, listed below, each carrying its own order. ' "$FLASH"
              fi
              printf '%s\n\n' "$CHANNEL_NOTE"
            fi
            printf 'TRANSITION OPS — WEEKLY WATCH SITREP\n'
            printf 'Window: %s to %s\n\n' "$SINCE" "$(date -u +%F)"
            printf 'CHANGES\n'
            if [ "$TOTAL" -eq 0 ]; then
              printf '  NO FINDINGS this week.\n'
            else
              printf '  %s issue(s) filed, %s FLASH.\n\n' "$TOTAL" "$FLASH"
              jq -r '.[] | "  - #\(.number) [\(.state)] \(.title)"' out/findings.json
            fi
            # N7 header line. Renders and stops: it does NOT touch BLUF_ITEMS,
            # because its subject is a RATE, not a finding. Rate-watching is
            # force-mod review work, not a 0300 problem. See design D.3 N7.
            if [ -s out/n7-trips.txt ]; then
              while read -r N7_PROD N7_N; do
                [ -n "$N7_PROD" ] || continue
                printf 'ROUTINE ARRIVAL HIGH — %s %s/wk — force-mod review\n' "$N7_PROD" "$N7_N"
              done < out/n7-trips.txt
              printf '\n'
            fi

            printf '\nCHANNEL HEALTH\n'
            if [ "$J1_OBSERVED" = "NA" ]; then
              printf '  J1 scheduled runs this window   NOT INSTRUMENTED — actions: read not granted\n'
            else
              printf '  J1 scheduled runs this window   7 expected / %s observed\n' "$J1_OBSERVED"
            fi
            if [ "$J2_OBSERVED" = "NA" ]; then
              printf '  J2 scheduled runs this window   NOT INSTRUMENTED — actions: read not granted\n'
            else
              printf '  J2 scheduled runs this window   1 expected / %s observed\n' "$J2_OBSERVED"
            fi
            if [ "$J1_GAP" = "true" ]; then
              printf '  J1 two consecutive zero-run days observed this window\n'
            fi
            printf '  Last ROUTINE canary             %s\n' "$LAST_CANARY_LINE"
            printf '\nCOVERAGE / DARK SOURCES / BURN\n'
            printf '  Not yet instrumented. J1 does not emit a coverage line and\n'
            printf '  J5 does not exist. Stated as a gap rather than omitted, so an\n'
            printf '  empty section is never read as a clean report.\n'
            printf '\nWATCH\n'
            printf '  Open items live in intel/scheduled-ops-design.md section 8.\n'
          } > out/sitrep.md
          cat out/sitrep.md

      # Sends EVERY week, including weeks with nothing to report. That is the
      # entire point: silence must be diagnostic, not ambiguous.
      - name: File SITREP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The ACTING ON THIS footer must carry THIS issue's number, and that
          # number does not exist until the issue does. Create, read the number
          # back off the URL gh prints, then edit the footer in. A failed edit
          # degrades to a SITREP without a footer - it never fails the run,
          # because the SITREP arriving at all is the channel test.
          URL=$(gh issue create \
            --title "SITREP $(date -u +%F)" \
            --body-file out/sitrep.md)
          N="${URL##*/}"
          case "$N" in
            ''|*[!0-9]*)
              echo "::warning::could not read an issue number from '$URL'; ACTING ON THIS footer not appended" ;;
            *)
              { cat out/sitrep.md
                printf '\n---\n\n## ACTING ON THIS\n\n'
                printf 'No session required. To act on anything here anyway: open the terminal and cite this issue number (#%s).\n' "$N"
              } > out/sitrep-final.md
              gh issue edit "$N" --body-file out/sitrep-final.md \
                || echo "::warning::footer edit failed for #$N; the issue is filed without it" ;;
          esac

      # N6a — the monthly ROUTINE canary. ROUTINE has no canary today and the
      # mail leg is proven by exactly one observation (section 8.12). Does
      # NOT count against N7 (the arrival-rate trigger); excluded from this
      # SITREP's own totals by title, the same way BASELINE_TITLE is.
      - name: File ROUTINE canary (N6a, monthly)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # JUDGMENT — "fixed monthly date" not pinned further by the
          # tasking. day-of-month <= 7 guarantees exactly one of J3's weekly
          # Monday runs lands in this window each month, regardless of which
          # weekday the 1st falls on. Re-derive if J3's cadence ever changes.
          DOM=$(date -u +%-d)
          if [ "$DOM" -gt 7 ]; then
            echo "ROUTINE canary not due this run (day of month $DOM > 7)"
            exit 0
          fi
          printf 'Monthly ROUTINE channel canary, per N6a (intel/scheduled-ops-design.md section D.3).\n\n' > out/canary.md
          printf 'This issue arriving, and the notification email it generates, IS the test.\n' >> out/canary.md
          printf 'No action required unless it does not arrive.\n\n' >> out/canary.md
          printf 'Does not count against N7 and is excluded from the weekly SITREP total by\n' >> out/canary.md
          printf 'title match, the same way the baseline issue is.\n' >> out/canary.md
          gh issue create --title "$ROUTINE_CANARY_TITLE" --body-file out/canary.md

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: j3-evidence-${{ github.run_id }}
          path: out/
          retention-days: 30

      - name: Report failure loudly
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          printf '1 item may need your eyes: J3 failed, so the weekly SITREP did not go out.\n\n' > out/failure.md
          printf 'J3 failed. Run %s. The weekly SITREP did not go out.\n' "$RUN_ID" >> out/failure.md
          URL=$(gh issue create --label FLASH --title "J3 FAILED $(date -u +%F)" --body-file out/failure.md)
          N="${URL##*/}"
          case "$N" in
            ''|*[!0-9]*)
              echo "::warning::could not read an issue number from '$URL'; ACTING ON THIS footer not appended" ;;
            *)
              { cat out/failure.md
                printf '\n---\n\n## ACTING ON THIS\n\n'
                printf 'An order for you to paste into an interactive session. The machine does not run it and ships nothing.\n\n'
                printf '```text\n'
                printf 'URGENT — machine failure session. Source: issue #%s, job: J3. s3-devops: read the run evidence, diagnose the failure, and propose the fix on a branch; gate it and stage on my approval. I merge.\n' "$N"
                printf '```\n'
              } > out/failure-final.md
              gh issue edit "$N" --body-file out/failure-final.md \
                || echo "::warning::footer edit failed for #$N; the issue is filed without it" ;;
          esac
